<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <img src="https://m.media-amazon.com/images/I/31q8xrY1XBL._UXNaN_FMjpg_QL85_.jpg" alt="">

    <h1>Express Login</h1>

    <form action="/login" method="POST">

        <label>Username</label><br>
        <input
            type="text"
            name="username"
            required
        ><br><br>

        <label>Password</label><br>
        <input
            type="password"
            name="password"
            required
        ><br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>
</html>
